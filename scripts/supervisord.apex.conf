[supervisord]
nodaemon=true
logfile=/workspace/supervisord.log
logfile_maxbytes=20MB
logfile_backups=3
pidfile=/tmp/supervisord.pid

[program:ollama]
command=/usr/bin/env bash -lc "ollama serve"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/workspace/ollama-supervisor.log
stderr_logfile=/workspace/ollama-supervisor.err.log
priority=10

[program:apex]
directory=/workspace/Apex_LLM
command=/usr/bin/env bash -lc "./scripts/runpod_start_apex.sh"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/workspace/apex-supervisor.log
stderr_logfile=/workspace/apex-supervisor.err.log
priority=20

[program:apex-watchdog]
directory=/workspace/Apex_LLM
command=/usr/bin/env bash -lc "./scripts/runpod_watchdog.sh"
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/workspace/apex-watchdog.log
stderr_logfile=/workspace/apex-watchdog.err.log
priority=30
