name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          APEX_API_KEY: ci-test-key
          APEX_SKIP_MODEL_LOAD: "1"
          APEX_RATE_LIMIT_PER_WINDOW: "200"
          APEX_KEYS_DB: "${{ github.workspace }}/data/apex_keys_ci.db"
        run: |
          pytest -q
