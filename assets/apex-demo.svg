<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#16243F"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" rx="22" fill="url(#bg)"/>
  <text x="40" y="54" fill="#F2F7FF" font-family="Segoe UI, Arial" font-size="30" font-weight="700">Apex Control Deck - Live Demo Snapshot</text>

  <rect x="40" y="88" width="1120" height="560" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)"/>

  <rect x="68" y="122" width="320" height="490" rx="14" fill="#0B1328" stroke="#2A3D68"/>
  <text x="90" y="162" fill="#DCE8FF" font-family="Segoe UI, Arial" font-size="20" font-weight="600">Prompt Composer</text>
  <rect x="90" y="184" width="276" height="130" rx="10" fill="#101B35" stroke="#2A3D68"/>
  <text x="104" y="214" fill="#9EB6E5" font-family="Consolas, monospace" font-size="14">Task: debug API auth + stream</text>
  <text x="104" y="238" fill="#9EB6E5" font-family="Consolas, monospace" font-size="14">tier: reasoning</text>
  <text x="104" y="262" fill="#9EB6E5" font-family="Consolas, monospace" font-size="14">task_type: code</text>

  <rect x="90" y="340" width="130" height="42" rx="8" fill="#FF7A45"/>
  <text x="122" y="367" fill="#1A0D08" font-family="Segoe UI, Arial" font-size="15" font-weight="700">Run Once</text>

  <rect x="412" y="122" width="720" height="490" rx="14" fill="#0B1328" stroke="#2A3D68"/>
  <text x="436" y="162" fill="#DCE8FF" font-family="Segoe UI, Arial" font-size="20" font-weight="600">Streaming Output</text>

  <text x="436" y="212" fill="#A7BDE8" font-family="Consolas, monospace" font-size="16">[status] loading  request_id=9e4... tier=reasoning</text>
  <text x="436" y="242" fill="#A7BDE8" font-family="Consolas, monospace" font-size="16">[delta] Let me analyze this request carefully...</text>
  <text x="436" y="272" fill="#A7BDE8" font-family="Consolas, monospace" font-size="16">[delta] 1) verify key validity and whitespace handling</text>
  <text x="436" y="302" fill="#A7BDE8" font-family="Consolas, monospace" font-size="16">[delta] 2) check quota and rate limits</text>
  <text x="436" y="332" fill="#A7BDE8" font-family="Consolas, monospace" font-size="16">[delta] 3) inspect SSE parser in frontend proxy</text>
  <text x="436" y="362" fill="#A7BDE8" font-family="Consolas, monospace" font-size="16">[done] run_id=4ac...</text>

  <rect x="436" y="404" width="640" height="6" rx="3" fill="#1F3054"/>
  <rect x="436" y="404" width="80" height="6" rx="3" fill="url(#pulse)">
    <animate attributeName="x" values="436;996;436" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <text x="436" y="460" fill="#7FE3C4" font-family="Segoe UI, Arial" font-size="16">p50 latency: 1.2s • p95 latency: 2.8s • throughput: 22 tok/s</text>
  <text x="436" y="488" fill="#7FE3C4" font-family="Segoe UI, Arial" font-size="16">usage_events: recorded • quota: ok • eval tag: code</text>
</svg>
